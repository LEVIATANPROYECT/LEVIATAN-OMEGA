name: PRE-T0 Verify Reveal

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[OMEGA-REVEAL]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify token and prevent reuse
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require("crypto");

            const issue = context.payload.issue;
            const body = issue.body || "";

            function section(name) {
              const escaped = name.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
              );

              const regex = new RegExp(
                `### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`
              );

              const match = body.match(regex);

              return match
                ? match[1].trim()
                : null;
            }

            async function fail(message, label = "pre-t0-reveal-fail") {

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body:
                  "## LEVIATÁN Ω — PRE-T0\n\n" +
                  "**REVELACIÓN: FAIL**\n\n" +
                  message +
                  "\n\n**T0 NO HA COMENZADO.**"
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [label]
              });

              core.setFailed(message);
            }

            const originalIssueRaw =
              section("ISSUE_ORIGINAL");

            const token =
              section("TOKEN");

            if (
              !originalIssueRaw ||
              !/^[0-9]+$/.test(originalIssueRaw)
            ) {
              await fail(
                "ISSUE_ORIGINAL no es válido."
              );
              return;
            }

            if (
              !token ||
              !/^[a-fA-F0-9]{64}$/.test(token)
            ) {
              await fail(
                "TOKEN debe contener exactamente 64 caracteres hexadecimales."
              );
              return;
            }

            const originalIssueNumber =
              Number(originalIssueRaw);

            const original =
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: originalIssueNumber
              });

            const originalBody =
              original.data.body || "";

            const commitmentMatch =
              originalBody.match(
                /TOKEN_COMMITMENT[\s\S]*?([a-fA-F0-9]{64})/
              );

            if (!commitmentMatch) {
              await fail(
                "No existe un TOKEN_COMMITMENT válido en el Issue original."
              );
              return;
            }

            const commitment =
              commitmentMatch[1].toLowerCase();

            const calculated =
              crypto
                .createHash("sha256")
                .update(
                  Buffer.from(token, "hex")
                )
                .digest("hex");

            if (calculated !== commitment) {
              await fail(
                "SHA-256(token) no coincide con el commitment."
              );
              return;
            }

            /*
             * ANTIRREUTILIZACIÓN PRE-T0
             *
             * Buscamos otras revelaciones PASS
             * asociadas al mismo Issue original.
             *
             * No publicamos nuevamente el token.
             */

            const search =
              await github.rest.search.issuesAndPullRequests({
                q:
                  `repo:${context.repo.owner}/${context.repo.repo} ` +
                  `is:issue label:pre-t0-reveal-pass`
              });

            for (const candidate of search.data.items) {

              if (candidate.number === issue.number) {
                continue;
              }

              const candidateBody =
                candidate.body || "";

              const match =
                candidateBody.match(
                  /### ISSUE_ORIGINAL\s*\n+([0-9]+)/
                );

              if (
                match &&
                Number(match[1]) === originalIssueNumber
              ) {
                await fail(
                  "Este commitment ya tiene una revelación válida. " +
                  "El token se considera CONSUMED.",
                  "pre-t0-token-reused"
                );

                return;
              }
            }

            /*
             * PRIMER CONSUMO VÁLIDO
             */

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body:
                "## LEVIATÁN Ω — PRE-T0\n\n" +
                "**REVELACIÓN CRIPTOGRÁFICA: PASS**\n\n" +
                "`SHA-256(token) = commitment`\n\n" +
                "**TOKEN STATUS: CONSUMED**\n\n" +
                "Este commitment ya no debe aceptar otra revelación válida.\n\n" +
                "Esta prueba NO constituye una contribución oficial.\n\n" +
                "**T0 NO HA COMENZADO.**"
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [
                "pre-t0-reveal-pass",
                "pre-t0-token-consumed"
              ]
            });

            /*
             * También marcamos el Issue original.
             */

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: originalIssueNumber,
              labels: [
                "pre-t0-token-consumed"
              ]
            });