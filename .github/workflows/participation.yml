name: Official participation

on:
  push:
    branches: [main]
    paths: ['runtime/**', '.github/workflows/participation.yml', 'launch.json']
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  issues: write

jobs:
  health:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47'
      - run: python -m runtime.github_runtime healthcheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_CONTENT_TOKEN: ${{ secrets.PRIVATE_CONTENT_TOKEN }}
          PRIVATE_KEYS_TOKEN: ${{ secrets.PRIVATE_KEYS_TOKEN }}
  capture:
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47'
      - run: python -m runtime.github_runtime capture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_CONTENT_TOKEN: ${{ secrets.PRIVATE_CONTENT_TOKEN }}
          PRIVATE_KEYS_TOKEN: ${{ secrets.PRIVATE_KEYS_TOKEN }}
  validate:
    needs: capture
    if: always() && (needs.capture.result == 'success' || needs.capture.result == 'skipped')
    concurrency:
      group: omega-canonical-validation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47'
      - run: python -m runtime.github_runtime drain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_CONTENT_TOKEN: ${{ secrets.PRIVATE_CONTENT_TOKEN }}
          PRIVATE_KEYS_TOKEN: ${{ secrets.PRIVATE_KEYS_TOKEN }}
