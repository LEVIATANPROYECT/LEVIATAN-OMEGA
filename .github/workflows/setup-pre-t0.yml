name: Setup PRE-T0

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Create PRE-T0 labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              ["omega-entry", "Entrada LEVIATÁN Ω"],
              ["omega-reveal", "Revelación de token PRE-T0"],
              ["pre-t0-invalid", "Entrada PRE-T0 estructuralmente inválida"],
              ["pre-t0-structural-pass", "Entrada PRE-T0 que supera validación estructural"],
              ["pre-t0-reveal-pass", "Token PRE-T0 verificado criptográficamente"],
              ["pre-t0-reveal-fail", "Token PRE-T0 no válido"],
              ["pre-t0-token-consumed", "Token PRE-T0 consumido correctamente"],
              ["pre-t0-token-reused", "Intento PRE-T0 de reutilización de token"],
              ["pending-moderation", "Pendiente de moderación"],
              ["accepted", "Contribución aceptada"],
              ["rejected", "Contribución rechazada"]
            ];

            for (const [name, description] of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });

                core.info(`Already exists: ${name}`);

              } catch (error) {

                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  description
                });

                core.info(`Created: ${name}`);
              }
            }

            core.info("PRE-T0 setup complete.");
            core.info("T0 HAS NOT STARTED.");