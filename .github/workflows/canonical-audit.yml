name: Canonical integrity and participation tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47'
      - run: python -m unittest discover -s tests -v
      - run: python -m runtime.audit
      - run: node --check docs/app.js
      - run: node --test tests/test_web.cjs
