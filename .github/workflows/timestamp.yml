name: Periodic public timestamp
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: write
concurrency:
  group: omega-timestamp
  cancel-in-progress: false
jobs:
  timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47' 'opentimestamps==0.4.5'
      - run: python -m runtime.periodic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
